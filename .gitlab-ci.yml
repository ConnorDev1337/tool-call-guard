# Lint, tests (Python 3.11-3.13 on Linux) and the scenario benchmark.
# Windows/macOS coverage comes from .github/workflows/ci.yml on the GitHub mirror.

stages: [lint, test, evaluate]

default:
  image: python:3.13-slim
  interruptible: true

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

.pip-cache:
  cache:
    key: pip-$CI_JOB_IMAGE
    paths: [.cache/pip]

lint:
  stage: lint
  extends: .pip-cache
  script:
    - pip install -e ".[dev]"
    - ruff check src tests
    - ruff format --check src tests
    - toolguard policy balanced
    - toolguard policy strict
    - toolguard policy examples/team-policy.toml

test:
  stage: test
  extends: .pip-cache
  image: python:${PYTHON_VERSION}-slim
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.11", "3.12", "3.13"]
  script:
    - pip install -e ".[dev]"
    - >
      python -m pytest
      --cov --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=90
      --junitxml=report.xml
  coverage: '/^TOTAL.*\s(\d+(?:\.\d+)?)%/'
  artifacts:
    when: always
    expire_in: 30 days
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

benchmark:
  stage: evaluate
  extends: .pip-cache
  needs: [test]
  script:
    - pip install .
    - toolguard eval --verbose | tee benchmark.txt
    - toolguard eval --json > benchmark.json
    - python examples/python_api.py
  artifacts:
    when: always
    expire_in: 90 days
    paths: [benchmark.txt, benchmark.json]
