# toolguard toolset mapping for the AgentDojo tools (workspace, slack, travel, banking).
#
# Written the way a deployer would describe this toolset to toolguard: from each
# tool's name, signature and docstring, before looking at any benchmark result.
# It only declares sources and sinks; the actions (how strict each rule is) come
# unchanged from the policy it is combined with (`toolguard eval --toolset`).
#
# Principles:
#   * Content written by third parties (e-mails, calendar invitations, shared
#     files, chat messages, web pages, business listings and reviews, the
#     counterparty text of bank transactions, bills) is UNTRUSTED.
#   * Personal data (mailbox, calendar, files, chats, contacts, profile, bank
#     data) is PRIVATE.
#   * A tool that acts on the world is a sink. Preset categories are reused when
#     the semantics match (send, payment, publish, web, destructive, write), and
#     two more, `access` (granting a party access to data) and `account` (changing
#     credentials or the profile), map onto the preset categories of the same
#     names (added by the policy-gap work; `access` mirrors send, `account`
#     mirrors payment). This file maps tools to categories only; postures live in
#     the policy.
#   * Critical arguments name WHO receives data, money or access (or WHICH object
#     is modified), not the content; content leaks are covered by `private_flow`
#     and `trifecta`, which look at every argument.
#
# Tool names are AgentDojo's function names, as an integration through the
# Python API would see them. Same-named tools of different suites (send_email,
# calendar tools) have the same semantics, so one mapping serves all suites.

version = 1

# ----------------------------------------------------------------- sources

# Mailbox, chats, calendar and shared files: written by others, about the user.
[[source]]
kind = "message"
untrusted = true
private = true
tools = [
  # workspace e-mail (sent and draft e-mails quote and forward received ones)
  "get_unread_emails", "get_received_emails", "get_sent_emails", "get_draft_emails",
  "search_emails",
  # slack
  "read_channel_messages", "read_inbox", "get_channels", "get_users_in_channel",
]

[[source]]
kind = "calendar"
untrusted = true             # Invitations are created by other people
private = true
tools = ["search_calendar_events", "get_day_calendar_events"]

[[source]]
kind = "document"
untrusted = true             # Files can be shared by, and with, other people
private = true
tools = [
  "list_files", "get_file_by_id", "search_files", "search_files_by_filename",
  "read_file",               # banking: bills and notices received from third parties
]

[[source]]
kind = "web"
untrusted = true
tools = ["get_webpage"]

# Business listings, reviews and flight offers come from third parties.
[[source]]
kind = "listing"
untrusted = true
tools = [
  "get_all_hotels_in_city", "get_hotels_prices", "get_rating_reviews_for_hotels",
  "get_hotels_address",
  "get_all_restaurants_in_city", "get_cuisine_type_for_restaurants", "get_restaurants_address",
  "get_rating_reviews_for_restaurants", "get_dietary_restrictions_for_all_restaurants",
  "get_contact_information_for_restaurants", "get_price_for_restaurants",
  "check_restaurant_opening_hours",
  "get_all_car_rental_companies_in_city", "get_car_types_available",
  "get_rating_reviews_for_car_rental", "get_car_fuel_options", "get_car_rental_address",
  "get_car_price_per_day",
  "get_flight_information",
]

# Incoming transactions carry a subject chosen by the sender.
[[source]]
kind = "bank-history"
untrusted = true
private = true
tools = ["get_most_recent_transactions"]

# The user's own data: contacts, profile, account details, scheduled payments.
[[source]]
kind = "personal"
private = true
tools = [
  "search_contacts_by_name", "search_contacts_by_email",
  "get_user_information",    # travel: passport, credit card and bank account numbers
  "get_user_info", "get_iban", "get_balance", "get_scheduled_transactions",
]

# Not classified (no third-party content, no personal data): get_current_day.

# ----------------------------------------------------------------- sinks

[[sink]]
category = "send"
egress = true
critical = ["recipients", "cc", "bcc"]
tools = ["send_email"]

# The docstrings state that both tools e-mail the participants.
[[sink]]
category = "send"
egress = true
critical = ["participants"]
tools = ["create_calendar_event", "add_calendar_event_participants"]

[[sink]]
category = "send"
egress = true
critical = ["recipient", "channel"]
tools = ["send_direct_message", "send_channel_message"]

[[sink]]
category = "access"
egress = true
critical = ["email", "user", "user_email", "channel"]
tools = ["share_file", "invite_user_to_slack", "add_user_to_channel"]

[[sink]]
category = "payment"
egress = true
critical = ["recipient", "amount"]
tools = ["send_money", "schedule_transaction", "update_scheduled_transaction"]

# A reservation commits the user to a business (like placing an order).
[[sink]]
category = "payment"
egress = true
critical = ["hotel", "restaurant", "company"]
tools = ["reserve_hotel", "reserve_restaurant", "reserve_car_rental"]

[[sink]]
category = "publish"
egress = true
critical = ["url"]
tools = ["post_webpage"]

[[sink]]
category = "web"
egress = true
critical = ["url"]
tools = ["get_webpage"]

[[sink]]
category = "destructive"
egress = false
critical = ["*"]
tools = ["delete_email", "delete_file", "cancel_calendar_event", "remove_user_from_slack"]

[[sink]]
category = "account"
egress = false
critical = ["*"]
tools = ["update_password", "update_user_info"]

# Changes to the user's own files and events; rescheduling notifies only the
# existing participants.
[[sink]]
category = "write"
egress = false
critical = ["filename", "file_id", "event_id"]
tools = ["create_file", "append_to_file", "reschedule_calendar_event"]
