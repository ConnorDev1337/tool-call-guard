  "mcp__*zendesk*__*get*", "mcp__*servicenow*__*get*", "mcp__*freshdesk*__*get*",
  "mcp__*asana*__get*", "mcp__*trello*__get*", "mcp__*shortcut*__get*",
  "mcp__*__get_issue*", "mcp__*__list_issues*", "mcp__*__get_pull_request*",
