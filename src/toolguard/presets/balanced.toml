# toolguard "balanced" preset.
#
# Threat model: the model may be steered by anything it reads (web pages, e-mails,
# issues, documents), so data from those sources is UNTRUSTED. Secrets and personal
# data are PRIVATE. Each sensitive action (sink) gets stricter the more directly
# untrusted data drives it:
#
#   tainted         the session has seen untrusted data (coarse, always sound)
#   untrusted_flow  a critical argument contains data seen in an untrusted source
#   private_flow    an argument carries private data (verbatim or secret-shaped)
#   trifecta        untrusted and private data in the session, and an egress sink
#
# Tool names follow Claude Code: built-ins (Bash, WebFetch, ...) and MCP tools as
# mcp__<server>__<tool>. Patterns are shell-style globs.

version = 1
mode = "enforce"
taint_ttl = 0                 # Seconds; 0 keeps the taint until `toolguard reset`
endorse_user_input = true     # User-typed values are not attributed to untrusted data
max_observation_chars = 262144

# ----------------------------------------------------------------- sources

[[source]]
kind = "web"
untrusted = true
tools = [
  "WebFetch", "WebSearch",
  "mcp__*fetch*", "mcp__*browser*", "mcp__*puppeteer*", "mcp__*playwright*",
  "mcp__*__*search_web*", "mcp__*__*web_search*", "mcp__*scrape*", "mcp__*crawl*",
  "mcp__*firecrawl*", "mcp__*brave*", "mcp__*tavily*", "mcp__*exa__*",
]

[[source]]
kind = "message"
untrusted = true
private = true
tools = [
  "mcp__*mail*__*read*", "mcp__*mail*__*get*", "mcp__*mail*__*search*", "mcp__*mail*__*list*",
  "mcp__*outlook*__*get*", "mcp__*outlook*__*list*", "mcp__*outlook*__*search*",
  "mcp__*slack*__*history*", "mcp__*slack*__*get*", "mcp__*slack*__*search*", "mcp__*slack*__*read*",
  "mcp__*discord*__*read*", "mcp__*discord*__*get*", "mcp__*telegram*__*get*",
  "mcp__*teams*__*get*", "mcp__*teams*__*list*",
  # Other chat platforms and generic chat readers (any server with these verbs).
  "mcp__*mattermost*__*get*", "mcp__*mattermost*__*read*", "mcp__*mattermost*__*list*",
  "mcp__*zulip*__*get*", "mcp__*rocketchat*__*get*", "mcp__*matrix*__*get*",
  "mcp__*__get_messages*", "mcp__*__read_messages*", "mcp__*__get_channel_messages*",
  "mcp__*__list_messages*", "mcp__*__get_conversation*",
]

# Invitations and events are created by other people and sit in the user's calendar.
[[source]]
