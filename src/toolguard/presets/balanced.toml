# Files, documents and pages can be shared by, and with, other people.
[[source]]
kind = "document"
untrusted = true
private = true
tools = [
  "mcp__*drive*__*read*", "mcp__*drive*__*get*", "mcp__*drive*__*search*",
  "mcp__*notion*__*get*", "mcp__*notion*__*search*", "mcp__*notion*__*retrieve*",
  "mcp__*confluence*__*get*", "mcp__*dropbox*__*read*", "mcp__*dropbox*__*get*",
  "mcp__*box*__*get*", "mcp__*box*__*read*", "mcp__*sharepoint*__*get*",
  "mcp__*onedrive*__*get*", "mcp__*gdocs*__*get*", "mcp__*quip*__*get*", "mcp__*coda*__*get*",
  "mcp__*__get_document*", "mcp__*__read_document*", "mcp__*__get_page", "mcp__*__get_file_by_id*",
]

# MCP resources (`resources/read`, including reads of resource templates) and prompts
# (`prompts/get`) carry whatever the server fronts (files, pages, records) or text its
# author wrote, so they are third-party content. The MCP proxy observes them as
# mcp__<server>__resources/read (argument `uri`) and mcp__<server>__prompts/get
# (`name`, `arguments`); Claude Code reads resources with ReadMcpResourceTool (`server`,
# `uri`). A policy declares content it vouches for with a [[trust]] rule.
[[source]]
kind = "resource"
untrusted = true
tools = ["mcp__*__resources/read", "ReadMcpResourceTool"]

[[source]]
kind = "prompt"
untrusted = true
tools = ["mcp__*__prompts/get"]

[[source]]
kind = "secret-file"
private = true
tools = [
  "Read", "mcp__*__read_file", "mcp__*__read_text_file", "mcp__*__read_multiple_files",
  "mcp__*__resources/read", "ReadMcpResourceTool",
]
when = { "*" = [
  "*/.ssh/*", "*/.aws/*", "*/.azure/*", "*/.config/gcloud/*", "*/.kube/*", "*/.docker/config.json",
  "*/.npmrc", "*/.pypirc", "*/.netrc", "*/.git-credentials", "*/.gnupg/*",
  "*.pem", "*.key", "*.p12", "*.pfx", "*/.env", "*/.env.*", "*credential*", "*secret*",
  "*/id_rsa*", "*/id_ed25519*", "*/id_ecdsa*",
] }

[[source]]
kind = "secret-command"
private = true
tools = ["Bash", "PowerShell"]
when = { command = [
  "*/.ssh/*", "*.pem*", "*id_rsa*", "*id_ed25519*", "*/.aws/*", "*credential*", "*printenv*",
  "*secret*", "*password*", "*.env*", "*gpg*--decrypt*", "*security find-*-password*",
] }

[[source]]
kind = "vault"
private = true
tools = [
  "mcp__*1password*__*", "mcp__*bitwarden*__*", "mcp__*keepass*__*", "mcp__*vault*__*read*",
  "mcp__*vault*__*get*", "mcp__*secret*__*get*",
]

[[source]]
kind = "database"
private = true
tools = [
  "mcp__*postgres*__*query*", "mcp__*mysql*__*query*", "mcp__*sqlite*__*query*",
  "mcp__*mongo*__*find*", "mcp__*supabase*__*query*", "mcp__*bigquery*__*query*",
]

# ----------------------------------------------------------------- sinks
# The first matching sink wins, so more specific entries come first.

# Reading an MCP resource hands its URI to the server, and resource templates let the
# agent build that URI. A file:// read stays on the machine that runs the server, so it
# is not an egress. An http(s), ws(s) or ftp URI is fetched from the network: a secret in
# it leaves like a secret in a WebFetch URL. Any other scheme names data the server fronts
# (an API, a database, a mailbox), which may be remote: a private value in the URI needs
# a human. These come first because server names such as `fetch` match later sinks.
[[sink]]
category = "local-read"
egress = false
critical = ["uri"]
tools = ["mcp__*__resources/read", "ReadMcpResourceTool"]
when = { uri = ["file:*"] }

[[sink]]
category = "web"
egress = true
critical = ["uri"]
tools = ["mcp__*__resources/read", "ReadMcpResourceTool"]
when = { uri = ["http:*", "https:*", "ws:*", "wss:*", "ftp:*", "ftps:*", "sftp:*"] }

[[sink]]
category = "resource"
egress = true
critical = ["uri"]
tools = ["mcp__*__resources/read", "ReadMcpResourceTool"]

[[sink]]
category = "payment"
egress = true
critical = [
  "to", "destination", "recipient", "beneficiary", "iban", "account", "account_number",
  "address", "wallet", "amount", "currency",
]
tools = [
  "mcp__*__*payment*", "mcp__*__*transfer*", "mcp__*__*payout*", "mcp__*__*charge*",
  "mcp__*__*refund*", "mcp__*__*withdraw*", "mcp__*__*send_money*", "mcp__*__*send_crypto*",
  "mcp__*__*trade*", "mcp__*__*place_order*",
]

[[sink]]
category = "send"
egress = true
critical = [
  "to", "cc", "bcc", "recipient", "recipients", "channel", "channel_id", "chat_id", "user",
  "user_id", "email", "address", "phone", "number", "webhook", "url",
]
tools = [
  "mcp__*__send*", "mcp__*__*reply*", "mcp__*__*forward*", "mcp__*__post_message*",
  "mcp__*__chat_post*", "mcp__*__*_post_message", "mcp__*__*send_message*", "mcp__*__*notify*",
]

# Claude Code's Monitor tool runs a shell command (or opens a WebSocket, `ws`) in the
# background, so it is a shell like Bash.
[[sink]]
category = "shell"
egress = false
critical = ["command", "cmd", "script", "code", "args", "ws"]
tools = [
  "Bash", "PowerShell", "Monitor", "mcp__*__*shell*", "mcp__*__*exec*", "mcp__*__run_command*",
  "mcp__*__*terminal*", "mcp__*__run_code*", "mcp__*__*execute*",
]

# Granting a party access to data (sharing, invitations, membership, permissions) is a
# disclosure like sending, so it gets the `send` posture. Precedes `publish` because
# forge `add_*`/`create_*` patterns would otherwise swallow collaborator grants.
[[sink]]
category = "access"
egress = true
critical = [
  "email", "user", "user_email", "username", "recipient", "member", "members",
  "collaborator", "principal", "grantee", "invitee", "channel", "channel_id", "team",
]
tools = [
  "mcp__*__share_*", "mcp__*__*invite*", "mcp__*__add_user_to_*", "mcp__*__add_member*",
  "mcp__*__add_collaborator*", "mcp__*__*add_collaborator", "mcp__*__grant_*",
  "mcp__*__*grant_access*", "mcp__*__set_permission*", "mcp__*__update_permission*",
  "mcp__*__add_to_channel*", "mcp__*__add_people*",
]

# Changing credentials, keys or the profile hands over control of the account, so an
# attacker-chosen value must block like a payment. Precedes `publish` for the same reason.
[[sink]]
category = "account"
egress = false
critical = ["*"]
tools = [
  "mcp__*__update_password*", "mcp__*__change_password*", "mcp__*__reset_password*",
  "mcp__*__update_recovery*", "mcp__*__set_recovery*", "mcp__*__update_email*",
  "mcp__*__change_email*", "mcp__*__update_user_info*", "mcp__*__update_profile*",
  "mcp__*__set_mfa*", "mcp__*__update_mfa*", "mcp__*__disable_mfa*", "mcp__*__add_ssh_key*",
  "mcp__*__*deploy_key*", "mcp__*__create_api_key*", "mcp__*__create_token*",
  "mcp__*__add_recovery_phone*", "mcp__*__rotate_*credential*",
]

[[sink]]
category = "publish"
egress = true
critical = ["owner", "repo", "repository", "project_id", "url", "path", "branch"]
tools = [
  "mcp__*github*__create_*", "mcp__*github*__update_*", "mcp__*github*__push_*",
  "mcp__*github*__add_*", "mcp__*github*__merge_*", "mcp__*gitlab*__create_*",
  "mcp__*gitlab*__update_*", "mcp__*gitlab*__push_*", "mcp__*gitlab*__merge_*",
  "mcp__*__*publish*", "mcp__*__*tweet*", "mcp__*__create_post*",
]

[[sink]]
category = "destructive"
egress = false
critical = ["*"]
tools = ["mcp__*__delete*", "mcp__*__*remove*", "mcp__*__*drop*", "mcp__*__*purge*", "mcp__*__*destroy*"]

[[sink]]
category = "web"
egress = true
critical = ["url"]
tools = [
  "WebFetch", "mcp__*fetch*", "mcp__*browser*__*navigate*", "mcp__*playwright*__*navigate*",
  "mcp__*puppeteer*__*navigate*", "mcp__*__http_request*", "mcp__*__*http_post*",
]

# Writing to a path the system runs or trusts automatically (start-up files, git hooks,
# CI configs, build and package scripts, test configuration) is deferred code execution,
# so it gets the shell posture and EVERY argument is critical (the payload is the content,
# not the path). Precedes `write`, which keeps the path-only check for ordinary files.
[[sink]]
category = "autoexec"
egress = false
critical = ["*"]
tools = ["Write", "Edit", "MultiEdit"]
when = { file_path = [
  "*/conftest.py", "conftest.py", "*/.github/workflows/*", "*/.gitea/workflows/*",
  "*/.gitlab-ci.yml", "*.gitlab-ci.yml", "*/.gitlab/*.yml", "*/Makefile", "Makefile",
  "*/makefile", "*/GNUmakefile", "*/package.json", "package.json", "*/.git/hooks/*",
  "*/.githooks/*", "*/.pre-commit-config.yaml", "*/.bashrc", "*/.zshrc", "*/.profile",
  "*/.bash_profile", "*/.zprofile", "*/.bash_login", "*/.zshenv", "*/.config/fish/*",
  "*/Dockerfile", "Dockerfile", "*/Dockerfile.*", "*/docker-compose*.yml",
  "*/docker-compose*.yaml", "*/compose.yml", "*/compose.yaml", "*/.circleci/*",
  "*/azure-pipelines.yml", "*/Jenkinsfile", "Jenkinsfile", "*/.drone.yml",
  "*/bitbucket-pipelines.yml", "*/.travis.yml", "*/appveyor.yml", "*/setup.py",
  "*/noxfile.py", "*/tox.ini", "*/tasks.py", "*/.vscode/tasks.json", "*/.vscode/launch.json",
  "*/crontab", "*/cron.d/*", "*/.config/autostart/*", "*/.ssh/authorized_keys",
  "*/.ssh/config",
] }

[[sink]]
category = "autoexec"
egress = false
critical = ["*"]
tools = ["mcp__*__write_file", "mcp__*__edit_file", "mcp__*__create_file", "mcp__*__move_file"]
when = { path = [
  "*/conftest.py", "conftest.py", "*/.github/workflows/*", "*/.gitea/workflows/*",
  "*/.gitlab-ci.yml", "*.gitlab-ci.yml", "*/.gitlab/*.yml", "*/Makefile", "Makefile",
  "*/makefile", "*/GNUmakefile", "*/package.json", "package.json", "*/.git/hooks/*",
  "*/.githooks/*", "*/.pre-commit-config.yaml", "*/.bashrc", "*/.zshrc", "*/.profile",
  "*/.bash_profile", "*/.zprofile", "*/.bash_login", "*/.zshenv", "*/.config/fish/*",
  "*/Dockerfile", "Dockerfile", "*/Dockerfile.*", "*/docker-compose*.yml",
  "*/docker-compose*.yaml", "*/compose.yml", "*/compose.yaml", "*/.circleci/*",
  "*/azure-pipelines.yml", "*/Jenkinsfile", "Jenkinsfile", "*/.drone.yml",
  "*/bitbucket-pipelines.yml", "*/.travis.yml", "*/appveyor.yml", "*/setup.py",
  "*/noxfile.py", "*/tox.ini", "*/tasks.py", "*/.vscode/tasks.json", "*/.vscode/launch.json",
  "*/crontab", "*/cron.d/*", "*/.config/autostart/*", "*/.ssh/authorized_keys",
  "*/.ssh/config",
] }

[[sink]]
category = "write"
egress = false
critical = ["file_path", "path", "notebook_path", "destination", "target"]
tools = [
  "Write", "Edit", "MultiEdit", "NotebookEdit", "mcp__*__write_file", "mcp__*__edit_file",
  "mcp__*__create_file", "mcp__*__move_file", "mcp__*__create_directory",
]

# ----------------------------------------------------------------- actions

[actions.default]
tainted = "confirm"
untrusted_flow = "block"
private_flow = "block"
trifecta = "block"

# An attacker-chosen recipient or account blocks outright; private content or the
# untrusted and private combination ("reply to this e-mail") needs a human. When the
# value comes from a source the user named (the IBAN on the bill they asked to pay),
# the guard cannot tell a legitimate value from an injected one, so it asks a human
# (directed_flow) instead of blocking.
[actions.payment]
tainted = "confirm"
untrusted_flow = "block"
directed_flow = "confirm"
private_flow = "confirm"
trifecta = "confirm"

[actions.send]
tainted = "confirm"
untrusted_flow = "block"
directed_flow = "confirm"
private_flow = "confirm"
trifecta = "confirm"

# Sharing/inviting mirrors `send`: an attacker-chosen grantee blocks, a grantee from a
# source the user named needs a human.
[actions.access]
tainted = "confirm"
untrusted_flow = "block"
directed_flow = "confirm"
private_flow = "confirm"
trifecta = "confirm"

# An account change with an attacker-chosen value blocks like a payment.
[actions.account]
tainted = "confirm"
untrusted_flow = "block"
directed_flow = "confirm"
private_flow = "confirm"
trifecta = "confirm"

# Writing to an auto-executed path takes the shell posture: any untrusted evidence in
# the content or path is shown to a human.
[actions.autoexec]
tainted = "confirm"
untrusted_flow = "confirm"
private_flow = "confirm"
trifecta = "confirm"

[actions.shell]
tainted = "confirm"
untrusted_flow = "confirm"   # The human sees which page or e-mail the command came from
private_flow = "confirm"
trifecta = "confirm"

[actions.publish]
tainted = "confirm"
untrusted_flow = "confirm"
private_flow = "block"       # Publishing secrets
trifecta = "confirm"

[actions.destructive]
tainted = "confirm"
untrusted_flow = "block"
private_flow = "confirm"
trifecta = "confirm"

[actions.web]
tainted = "allow"            # Following links is normal browsing
untrusted_flow = "allow"
private_flow = "block"       # Secrets in a URL are exfiltration
trifecta = "confirm"

[actions.write]
tainted = "allow"
untrusted_flow = "confirm"   # An attacker-chosen path (e.g. ~/.bashrc) needs a human
private_flow = "allow"
trifecta = "allow"

# Reading a resource is not an action on the world: what it returns is observed as a
# source, so only what the URI itself carries out is checked.
[actions.local-read]
tainted = "allow"
untrusted_flow = "allow"
private_flow = "allow"
trifecta = "allow"

# Resources are third-party content themselves, so untrusted and private data are
# usually both in context; asking on every read would teach the human to approve
# blindly. A private value inside the URI is the leak that matters.
[actions.resource]
tainted = "allow"
untrusted_flow = "allow"
private_flow = "confirm"
trifecta = "allow"

# ----------------------------------------------------------------- self-protection
# The agent must not approve its own requests, reset the taint or edit the
# guard's state, policy or hook configuration.

[[protect]]
tools = ["Bash", "PowerShell", "Monitor", "mcp__*__*shell*", "mcp__*__*exec*", "mcp__*__run_command*", "mcp__*__*terminal*"]
args = { "*" = ["*toolguard*", "*/.claude/settings*.json*"] }
message = "agents may not invoke the guard or edit its configuration (self-approval / tampering)"

[[protect]]
tools = ["Write", "Edit", "MultiEdit", "mcp__*__write_file", "mcp__*__edit_file", "mcp__*__move_file"]
args = { "*" = ["*/.toolguard/*", "*toolguard*.toml", "*/.claude/settings.json", "*/.claude/settings.local.json"] }
message = "agents may not modify the guard's state, policy or hook configuration"
