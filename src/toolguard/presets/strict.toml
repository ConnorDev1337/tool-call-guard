# toolguard "strict" preset: the balanced sources, sinks and self-protection, but
# any evidence of untrusted data reaching a sink blocks, every sensitive action in
# a tainted session needs a human, and the shell counts as egress.

extends = "balanced"

# Precedes the balanced shell sink, since policy entries come before the preset's.
[[sink]]
category = "shell"
egress = true
critical = ["*"]
tools = [
  "Bash", "PowerShell", "Monitor", "mcp__*__*shell*", "mcp__*__*exec*", "mcp__*__run_command*",
  "mcp__*__*terminal*", "mcp__*__run_code*", "mcp__*__*execute*",
]

[actions.shell]
tainted = "confirm"
untrusted_flow = "block"
private_flow = "block"
trifecta = "block"

[actions.payment]
directed_flow = "block"
private_flow = "block"
trifecta = "block"

[actions.send]
directed_flow = "block"
private_flow = "block"
trifecta = "block"

# Inherited from balanced; strict blocks on any untrusted evidence, directed or not.
[actions.access]
untrusted_flow = "block"
directed_flow = "block"
private_flow = "block"
trifecta = "block"

[actions.account]
untrusted_flow = "block"
directed_flow = "block"
private_flow = "block"
trifecta = "block"

# Auto-executed paths take the strict shell posture.
[actions.autoexec]
tainted = "confirm"
untrusted_flow = "block"
private_flow = "block"
trifecta = "block"

[actions.publish]
untrusted_flow = "block"
trifecta = "block"

[actions.destructive]
trifecta = "block"

[actions.web]
tainted = "confirm"
untrusted_flow = "confirm"
trifecta = "block"

[actions.write]
tainted = "confirm"
untrusted_flow = "block"
trifecta = "confirm"

# A private value in a resource URI blocks, and an untrusted and private session asks
# before reading a resource that may be remote.
[actions.resource]
private_flow = "block"
trifecta = "confirm"
